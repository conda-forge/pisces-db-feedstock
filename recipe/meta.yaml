{% set name = "pisces" %}
{% set version = "0.4.9" %}


package:
  name: {{ name|lower }}-db
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pisces-{{ version }}.tar.gz
  sha256: 4b63b9f62dd5cf15773be7e48a463f7aaf8c1df9a836ec6cf0f5447ba6649dbd
  patches:
    - 0001-fix-plugin-loading.patch

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pisces = pisces.commands.main:cli

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=61
  run:
    - click
    - numpy
    - obspy >=1.4.1
    - python >={{ python_min }}
    - sqlalchemy >=1.4

test:
  files:
    - test_plugins.py
  imports:
    - pisces
    - pisces.commands
  commands:
    - pip check
    - pisces --help
    - python test_plugins.py
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/LANL-Seismoacoustics/pisces
  summary: A Practical Seismological Database Library in Python.
  license: MIT
  license_file: LICENSE.txt
  description: |
    Pisces is a Python library that connects your geophysical analysis
    environment to a SQL database that uses the Center for Seismic 
    Studies (CSS) 3.0 or NNSA KB Core table schema.
  doc_url: https://lanl-seismoacoustics.github.io/pisces/
  dev_url: https://github.com/lanl-seismoacoustics/pisces/

extra:
  recipe-maintainers:
    - samuelchodur
